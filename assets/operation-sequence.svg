<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="778" viewBox="0 0 1080 778" role="img" aria-labelledby="title desc">
<title id="title">Ascii Video operation sequence</title><desc id="desc">An actor and data sequence containing the six concrete stages for Ascii Video.</desc>
<rect width="1080" height="778" rx="26" fill="#F8FAFC"/><rect width="1080" height="14" rx="7" fill="#A21CAF"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#A21CAF" text-anchor="start"><tspan x="54" dy="0">ACTOR AND DATA SEQUENCE</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">Ascii Video</tspan></text><rect x="130" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="152" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="152" dy="0">Video or audio</tspan><tspan x="152" dy="23">source</tspan></text><line x1="225" y1="227" x2="225" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="370" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="392" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="392" dy="0">Ascii Video</tspan></text><line x1="465" y1="227" x2="465" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="632" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="632" dy="0">FFmpeg encoder</tspan></text><line x1="705" y1="227" x2="705" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="850" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="872" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="872" dy="0">MP4 or GIF</tspan></text><line x1="945" y1="227" x2="945" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><path d="M225 270 L465 270" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="345.0" y="258" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="345.0" dy="0">Inspect duration resolution and audio</tspan></text><circle cx="465" cy="270" r="5" fill="#A21CAF"/><path d="M465 358 L705 358" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="585.0" y="346" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="585.0" dy="0">Choose frame rate width and glyph palette</tspan></text><circle cx="705" cy="358" r="5" fill="#A21CAF"/><path d="M705 446 L945 446" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="7 6"/><text x="825.0" y="434" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="825.0" dy="0">Render each frame as colored characters</tspan></text><circle cx="945" cy="446" r="5" fill="#A21CAF"/><path d="M225 534 L465 534" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="345.0" y="522" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="345.0" dy="0">Synchronize frames with source timing</tspan></text><circle cx="465" cy="534" r="5" fill="#A21CAF"/><path d="M465 622 L705 622" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="585.0" y="610" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="585.0" dy="0">Encode MP4 or GIF with FFmpeg</tspan></text><circle cx="705" cy="622" r="5" fill="#A21CAF"/><path d="M705 710 L945 710" stroke="#A21CAF" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="7 6"/><text x="825.0" y="698" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="825.0" dy="0">Inspect motion readability and file size</tspan></text><circle cx="945" cy="710" r="5" fill="#A21CAF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#A21CAF"/></marker></defs></svg>